version: 1
name: documents
defaults:
  scope: session
  on_failure: skip
# 读不了就装包。内核的 `read` 只会读文本；这个包给 `read` 装上 PDF 和 Office
# 的 reader（`Contributions::reader`），装上之后同一个 `read` 调用就能读二进制
# 文档，卸载之后 `read` 会说"这个格式读不了"，并列出已经装了什么。
stages:
- name: pack
  plugins:
  - id: documents
    source: builtin:documents
    scope: global
