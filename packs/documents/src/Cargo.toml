[package]
name = "ngu-documents"
version = "1.0.0"
edition = "2021"
description = "The documents plugin: teach `read` PDF and Office formats"
license = "MIT"

[[bin]]
name = "ngu-documents"
path = "main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
