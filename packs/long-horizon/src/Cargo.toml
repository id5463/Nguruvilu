[package]
name = "ngu-long-horizon"
version = "1.0.0"
edition = "2021"
description = "Long-horizon missions: a task entity on disk, an append-only log, checkpoints, mailboxes"
license = "MIT"

[[bin]]
name = "ngu-long-horizon"
path = "main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
