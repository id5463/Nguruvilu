[package]
name = "ngu-judge"
version = "1.0.0"
edition = "2021"
description = "The judge plugin: a decision model in the loop, as a process"
license = "MIT"

[[bin]]
name = "ngu-judge"
path = "main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
