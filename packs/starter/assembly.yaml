version: 1
name: starter
defaults:
  scope: session
  on_failure: skip
stages:
- name: pack
  plugins:
  # 子代理。starter 声明它，`packs/delegate` 也声明它 —— 两个包都装时内核会
  # 认出这是同一个能力（entry id 相同），只起一个进程、只注册一份工具，第二
  # 次声明报 `reused`。所以这里放一份是安全的，也是必要的：只装 starter 的
  # 机器也应该有子代理，不该要求它再单独装一个包。
  - id: delegate
    source: plugin:bin/ngu-delegate
    scope: global
    build:
      dir: src
      binary: ngu-delegate
  # 联网搜索。它曾经是 `builtin:search` —— 内核里的实现，读 NGU_PROXY 而模型
  # 路由读 settings.proxy，两边不一致，用户看到的只是每次搜索 403。
  #
  # 那份实现被搬成 `packs/web-search`（Python MCP，由包自己管方言和代理顺
  # 序），而这行留在了这里：我删掉了失效的 `builtin:search`，却没有把新的
  # 补上，于是 starter 装完之后没有搜索。主人问"联网搜索可用吗"，答案是
  # 没有 —— 因为起始包从来没装过它。
  #
  # `path` 指向同仓库的兄弟包；装 starter 时若那个包不在，这一条按
  # on_failure: skip 跳过并如实报告，而不是静默。
  mcp:
  - id: web-search
    source: stdio:python bin/web_search.py
    scope: session
    transport: stdio
    command: python
    args:
    - bin/web_search.py
