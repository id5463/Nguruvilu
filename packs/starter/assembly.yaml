version: 1
name: starter
defaults:
  scope: session
  on_failure: skip
stages:
- name: pack
  plugins:
  # 子代理。它曾经是 `builtin:delegate`，内核里那段代码已经删掉了（和
  # `builtin:judge` / `builtin:long-horizon` 一样搬成包），留着那行只会让装载
  # 报 "not defined in this kernel"。
  #
  # 这里用一个**独立的包**，而不是把 delegate 的二进制塞进 starter：它是
  # 可选的，而 starter 里其他东西是基础的。不装 delegate 也能用 starter，
  # 只是没有 `delegate` 这个工具。
  #
  # 装载器按 `plugin:bin/ngu-delegate` 在**本包目录**里找，所以 starter 需要
  # 自己带一份。`sync-market.py` 打包时不会跨包复制，因此这里指向本包的
  # `bin/`；`starter/bin/` 下有没有那份二进制由打包脚本保证。
  - id: delegate
    source: plugin:bin/ngu-delegate
    scope: global
  # 联网搜索。它曾经是 `builtin:search` —— 内核里的实现，读 NGU_PROXY 而模型
  # 路由读 settings.proxy，两边不一致，用户看到的只是每次搜索 403。
  #
  # 那份实现被搬成 `packs/web-search`（Python MCP，由包自己管方言和代理顺
  # 序），而这行留在了这里：我删掉了失效的 `builtin:search`，却没有把新的
  # 补上，于是 starter 装完之后没有搜索。主人问"联网搜索可用吗"，答案是
  # 没有 —— 因为起始包从来没装过它。
  #
  # `path` 指向同仓库的兄弟包；装 starter 时若那个包不在，这一条按
  # on_failure: skip 跳过并如实报告，而不是静默。
  mcp:
  - id: web-search
    source: stdio:python bin/web_search.py
    scope: session
    transport: stdio
    command: python
    args:
    - bin/web_search.py
