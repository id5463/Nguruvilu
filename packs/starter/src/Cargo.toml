[package]
name = "ngu-delegate"
version = "1.0.0"
edition = "2021"
description = "The delegate plugin: run a subtask in its own kernel process"
license = "MIT"

[[bin]]
name = "ngu-delegate"
path = "main.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
