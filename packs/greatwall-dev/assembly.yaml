version: 1
name: greatwall-dev
defaults:
  scope: session
  on_failure: skip
# 一个包，一件事：票板的 MCP，也就是派活的那一半。
#
# 长程任务的工具（mission_start / advance / recall …）曾经也在这里，作为
# `builtin:long-horizon`。它们现在是 `packs/long-horizon` 自己产的二进制，
# 而一个包引用另一个包的构建产物是不可能的：装完之后两个包是两棵独立的
# 目录，谁也不知道谁在那儿。所以这里只留票板；要长程任务就再装那个包。
#
# on_failure: skip 保留 —— 服务器起不来的时候，工具表里少几个工具是能看见
# 的，整包装载失败是看不见的。
stages:
- name: tools
  mcp:
  - id: ticket
    source: stdio:node bin/ticket-mcp.mjs
    scope: session
    transport: stdio
    command: node
    args:
    - bin/ticket-mcp.mjs
