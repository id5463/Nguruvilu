<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nguruvilu</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #171a1f;
    --line: #262b33;
    --text: #d8dee9;
    --dim: #7c8798;
    --accent: #6ea8fe;
    --ok: #7ddc9a;
    --bad: #ff8f8f;
    --warn: #e8c98a;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr) 340px;
    grid-template-rows: minmax(0, 1fr) auto 26px;
    font: 13px/1.55 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  .panel { background: var(--panel); overflow: auto; }
  #sessions { border-right: 1px solid var(--line); padding: 12px 10px; }
  #details  { border-left: 1px solid var(--line); padding: 12px 12px; }

  h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--dim); margin: 0 0 8px; font-weight: 600;
  }
  h2:not(:first-child) { margin-top: 18px; }

  /* ---- settings ---- */
  .warn {
    background: #2a2118; border: 1px solid #5a4426; color: var(--warn);
    border-radius: 6px; padding: 8px 10px; font-size: 11.5px;
    margin-bottom: 10px; line-height: 1.5;
  }
  label.field { display: block; margin-bottom: 8px; }
  label.field .cap { display: block; font-size: 10.5px; color: var(--dim); margin-bottom: 3px; }
  label.field input {
    width: 100%; background: #1b1f26; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; font: inherit; font-size: 12px;
  }
  label.field input:focus { outline: none; border-color: #35507a; }
  .row { display: flex; gap: 6px; align-items: center; }
  button.small {
    padding: 6px 12px; cursor: pointer; font: inherit; font-size: 12px;
    background: #24405f; color: #dbe8fb;
    border: 1px solid #35507a; border-radius: 6px;
  }
  button.small:hover { background: #2b4c72; }
  button.small.ghost { background: #1d222a; color: #b9c4d4; border-color: var(--line); }
  button.small.ghost:hover { background: #232a34; }
  .hint { color: var(--dim); font-size: 10.5px; margin-top: 6px; word-break: break-all; line-height: 1.5; }
  .saved { color: var(--ok); font-size: 10.5px; }

  /* ---- session list ---- */
  .sess {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; border-radius: 6px; cursor: default;
    color: #aab4c4; font-size: 12px;
  }
  .sess:hover { background: #1d222a; }
  .sess.active { background: #212936; color: #e8eefb; }
  .sess .title {
    flex: 1; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .sess .n { color: var(--dim); font-size: 10px; font-variant-numeric: tabular-nums; }
  .sess .del {
    opacity: 0; color: var(--dim); border: none; background: none;
    cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px;
  }
  .sess:hover .del { opacity: 1; }
  .sess .del:hover { color: var(--bad); }
  button.action {
    width: 100%; margin-top: 8px; padding: 7px 8px; cursor: pointer;
    background: #1d222a; color: #b9c4d4; border: 1px solid var(--line);
    border-radius: 6px; font: inherit; font-size: 12px;
  }
  button.action:hover { background: #232a34; color: #dbe4f2; }

  /* ---- conversation ---- */
  #stream { padding: 18px 22px; }
  .turn { margin-bottom: 18px; }
  .who {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin-bottom: 4px;
  }
  .body { white-space: pre-wrap; word-break: break-word; }
  .user .body { color: #e8eefb; }
  .assistant .body { color: #cfd8e6; }
  .tool-call {
    font-family: var(--mono); font-size: 11.5px; color: #9ecbff;
    background: #1b2029; border: 1px solid var(--line); border-left: 2px solid #3d5a80;
    border-radius: 5px; padding: 6px 9px; margin: 5px 0;
    white-space: pre-wrap; word-break: break-all;
  }
  .tool-result {
    font-family: var(--mono); font-size: 11px; color: #9aa6b8;
    background: #191d24; border: 1px solid var(--line);
    border-radius: 5px; padding: 6px 9px; margin: 5px 0 8px;
    max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
  .tool-result.bad { border-color: #4a2b2b; color: #e0a9a9; }
  .err-entry {
    background: #2a1a1a; border: 1px solid #5a2b2b; color: #f0b0b0;
    border-radius: 6px; padding: 10px 12px; margin-bottom: 16px;
    font-size: 12px; white-space: pre-wrap; word-break: break-word;
  }
  .err-entry .cap {
    display: block; font-size: 10px; text-transform: uppercase;
    letter-spacing: .08em; color: #c98a8a; margin-bottom: 5px;
  }
  .empty { color: var(--dim); font-style: italic; }
  .caret {
    display: inline-block; width: 7px; height: 14px; margin-left: 2px;
    background: var(--accent); vertical-align: text-bottom;
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  /* ---- composer ---- */
  #composer {
    grid-column: 1 / -1;
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 12px;
    display: flex; gap: 8px; align-items: flex-end;
  }
  #input {
    flex: 1; resize: none; min-height: 38px; max-height: 160px;
    background: #1b1f26; color: var(--text);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 9px 11px; font: inherit;
  }
  #input:focus { outline: none; border-color: #35507a; }
  #send {
    padding: 9px 18px; cursor: pointer; font: inherit;
    background: #24405f; color: #dbe8fb;
    border: 1px solid #35507a; border-radius: 7px;
  }
  #send:hover { background: #2b4c72; }
  #send:disabled { opacity: .45; cursor: default; }

  /* ---- status bar ---- */
  #status {
    grid-column: 1 / -1;
    border-top: 1px solid var(--line);
    background: #121418;
    display: flex; align-items: center; gap: 14px;
    padding: 0 12px; font-size: 10.5px; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  #status .dot { color: var(--ok); }
  #status .dot.busy { color: var(--accent); }
  #status .dot.unset { color: var(--warn); }

  /* ---- details ---- */
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 2px 0; }
  .kv .k { color: var(--dim); }
  .kv .v { color: #b9c4d4; font-family: var(--mono); font-size: 11px;
           max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip {
    display: inline-block; font-family: var(--mono); font-size: 10.5px;
    background: #1d222a; border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 6px; margin: 2px 3px 2px 0; color: #9fb0c6;
  }
  .skill { font-size: 12px; padding: 4px 0; }
  .skill .id { font-family: var(--mono); color: #9ecbff; font-size: 11px; }
  .skill .d { color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
  <aside id="sessions" class="panel">
    <h2>Sessions</h2>
    <div id="session-list"></div>
    <button class="action" id="new-session">+ New session</button>
  </aside>

  <main id="stream" class="panel"></main>

  <aside id="details" class="panel">
    <h2>Settings</h2>
    <div id="settings">
      <div class="warn" id="not-configured" hidden></div>
      <label class="field">
        <span class="cap">API endpoint</span>
        <input id="set-base-url" placeholder="https://your-host/v1" spellcheck="false">
      </label>
      <label class="field">
        <span class="cap">API key</span>
        <input id="set-api-key" type="password" placeholder="sk-..." spellcheck="false">
      </label>
      <label class="field">
        <span class="cap">Model</span>
        <input id="set-model" placeholder="model-id" spellcheck="false">
      </label>
      <div class="row">
        <button class="small" id="save-settings">Save</button>
        <span class="saved" id="settings-saved" hidden>saved</span>
      </div>
      <div class="hint" id="settings-path"></div>
    </div>

    <h2>Runtime</h2>
    <div id="runtime-info"></div>
    <h2>Skills</h2>
    <div id="skill-info"></div>
    <h2>Tools</h2>
    <div id="tool-info"></div>
    <h2>Tool output</h2>
    <div id="log-info"><span class="empty">No tool output yet.</span></div>
  </aside>

  <div id="composer">
    <textarea id="input" rows="1" placeholder="Ask the kernel something&hellip;  (Enter to send, Shift+Enter for a newline)"></textarea>
    <button id="send">Send</button>
  </div>

  <div id="status">
    <span><span class="dot" id="dot">&#9679;</span> <span id="state">idle</span></span>
    <span id="model"></span>
    <span id="stats"></span>
    <span id="timing"></span>
  </div>

<script>
"use strict";

// ---------------------------------------------------------------- shell API

// Named `toShell`, not `ipc`: wry already owns `window.ipc`, and a top-level
// `const ipc` would collide with it. That collision is a parse-time SyntaxError,
// which kills the entire script — including its first line — with no visible clue.
const toShell = (payload) => window.ipc.postMessage(JSON.stringify(payload));

// ---------------------------------------------------------------- elements

const stream = document.getElementById("stream");
const sessionList = document.getElementById("session-list");
const logInfo = document.getElementById("log-info");
const runtimeInfo = document.getElementById("runtime-info");
const skillInfo = document.getElementById("skill-info");
const toolInfo = document.getElementById("tool-info");
const input = document.getElementById("input");
const send = document.getElementById("send");

const setBaseUrl = document.getElementById("set-base-url");
const setApiKey = document.getElementById("set-api-key");
const setModel = document.getElementById("set-model");
const notConfigured = document.getElementById("not-configured");
const settingsSaved = document.getElementById("settings-saved");
const settingsPath = document.getElementById("settings-path");

// The assistant turn currently being streamed, if any.
let live = null;
let busy = false;
// Whether the user has typed into the settings fields since the last status
// push. Without this, an incoming status would overwrite what they are typing.
let settingsDirty = false;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function scrollToEnd() {
  stream.scrollTop = stream.scrollHeight;
}

function clearStream(entries) {
  stream.replaceChildren();
  live = null;
  if (!entries || entries.length === 0) {
    stream.append(el("div", "empty", "New session. Nothing said yet."));
    return;
  }
  for (const entry of entries) renderEntry(entry);
  scrollToEnd();
}

function renderEntry(entry) {
  if (entry.role === "system") return;

  if (entry.role === "error") {
    stream.append(errorBlock(entry.text));
    return;
  }

  if (entry.role === "tool") {
    // A stored tool result is shown inline; the details panel keeps the latest.
    stream.append(el("div", "tool-result", entry.text));
    logInfo.replaceChildren(el("div", "tool-result", entry.text));
    return;
  }

  const turn = el("div", "turn " + entry.role);
  turn.append(el("div", "who", entry.role === "user" ? "you" : "kernel"));

  for (const call of entry.tool_calls || []) {
    turn.append(el("div", "tool-call", "\u2192 " + call.name + " " + call.arguments));
  }
  if (entry.text) turn.append(el("div", "body", entry.text));
  stream.append(turn);
}

function errorBlock(text) {
  const box = el("div", "err-entry");
  box.append(el("span", "cap", "request failed"));
  box.append(document.createTextNode(text));
  return box;
}

function startAssistantTurn() {
  const turn = el("div", "turn assistant");
  turn.append(el("div", "who", "kernel"));
  const body = el("div", "body");
  const caret = el("span", "caret");
  body.append(caret);
  turn.append(body);
  stream.append(turn);
  live = { turn, body, caret };
  scrollToEnd();
}

function appendAssistantText(delta) {
  if (!live) startAssistantTurn();
  live.caret.remove();
  live.body.append(document.createTextNode(delta));
  live.body.append(live.caret);
  scrollToEnd();
}

function appendToolCall(name, args) {
  if (!live) startAssistantTurn();
  // Keep the streaming text below the newest tool card.
  live.caret.remove();
  live.turn.insertBefore(el("div", "tool-call", "\u2192 " + name + " " + args), live.body);
  live.body.append(live.caret);
  scrollToEnd();
}

function appendToolResult(ok, text) {
  const box = el("div", "tool-result" + (ok ? "" : " bad"), text);
  if (live) {
    live.caret.remove();
    live.turn.insertBefore(box, live.body);
    live.body.append(live.caret);
  } else {
    stream.append(box);
  }
  logInfo.replaceChildren(el("div", "tool-result" + (ok ? "" : " bad"), text));
  scrollToEnd();
}

function endAssistantTurn() {
  if (live) {
    live.caret.remove();
    live = null;
  }
}

function appendUserTurn(text) {
  const turn = el("div", "turn user");
  turn.append(el("div", "who", "you"));
  turn.append(el("div", "body", text));
  stream.append(turn);
  scrollToEnd();
}

// ---------------------------------------------------------------- panels

function renderSessions(list) {
  sessionList.replaceChildren();
  for (const s of list || []) {
    const row = el("div", "sess" + (s.current ? " active" : ""));
    row.append(el("span", "title", s.title || s.id));
    row.append(el("span", "n", String(s.messages === undefined ? 0 : s.messages)));

    const del = el("button", "del", "\u00d7");
    del.title = "Delete this session";
    del.addEventListener("click", (event) => {
      event.stopPropagation();
      toShell({ cmd: "delete_session", id: s.id });
    });
    row.append(del);

    if (!s.current) {
      row.addEventListener("click", () => toShell({ cmd: "open_session", id: s.id }));
    }
    sessionList.append(row);
  }
}

function renderSettings(status) {
  settingsPath.textContent = status.settings_path
    ? "Stored in " + status.settings_path
    : "";

  // Never overwrite a field the user is in the middle of typing into.
  if (!settingsDirty) {
    setBaseUrl.value = status.base_url || "";
    setModel.value = status.model || "";
    // The key is never sent back in full; an empty box means "unchanged".
    setApiKey.value = "";
    setApiKey.placeholder = status.api_key_masked
      ? status.api_key_masked + "  (leave blank to keep)"
      : "sk-...";
  }

  const missing = status.missing || [];
  if (status.configured) {
    notConfigured.hidden = true;
  } else {
    notConfigured.hidden = false;
    notConfigured.textContent =
      "Not configured: " + missing.join(", ") +
      ". Fill in the endpoint and key below, then Save. " +
      "The endpoint must include the version segment, for example https://host/v1.";
  }
}

function renderStatus(status) {
  if (!status) return;

  document.getElementById("model").textContent = status.model || "";
  document.getElementById("stats").textContent =
    (status.messages === undefined ? 0 : status.messages) + " messages \u00b7 " +
    (status.tools || []).length + " tools";

  renderSettings(status);

  runtimeInfo.replaceChildren();
  const rows = [
    ["session", status.session],
    ["title", status.title || "(untitled)"],
    ["endpoint", status.base_url || "(not set)"],
    ["key", status.api_key_masked || "(not set)"],
    ["model", status.model],
    ["cache", status.cache_policy],
    ["config v", String(status.config_version)],
    ["plugins", (status.plugins || []).join(", ") || "none"],
  ];
  for (const pair of rows) {
    const row = el("div", "kv");
    row.append(el("span", "k", pair[0]));
    row.append(el("span", "v", pair[1] === undefined || pair[1] === null ? "" : pair[1]));
    runtimeInfo.append(row);
  }

  skillInfo.replaceChildren();
  const skills = status.skills || [];
  if (skills.length === 0) {
    skillInfo.append(el("div", "empty", "No skills found."));
  } else {
    for (const s of skills) {
      const box = el("div", "skill");
      box.append(el("div", "id", s.id));
      if (s.description) box.append(el("div", "d", s.description));
      skillInfo.append(box);
    }
  }

  toolInfo.replaceChildren();
  for (const name of status.tools || []) toolInfo.append(el("span", "chip", name));

  setBusy(!!status.busy);
  if (!status.configured) {
    document.getElementById("dot").className = "dot unset";
    document.getElementById("state").textContent = "not configured";
  }
}

function setBusy(value) {
  busy = value;
  send.disabled = value;
  if (!value) {
    document.getElementById("dot").className = "dot";
    document.getElementById("state").textContent = "idle";
  } else {
    document.getElementById("dot").className = "dot busy";
    document.getElementById("state").textContent = "working\u2026";
  }
}

// ---------------------------------------------------------------- events

window.ngu = {
  receive(event) {
    switch (event.ev) {
      case "sessions":
        renderSessions(event.list);
        break;
      case "transcript":
        clearStream(event.entries);
        break;
      case "status":
        renderStatus(event.status);
        break;
      case "settings_saved":
        settingsDirty = false;
        settingsSaved.hidden = false;
        setTimeout(() => { settingsSaved.hidden = true; }, 2000);
        break;
      case "turn_start":
        appendUserTurn(event.text);
        startAssistantTurn();
        setBusy(true);
        break;
      case "text":
        appendAssistantText(event.delta);
        break;
      case "reasoning":
        // Reasoning is not shown inline; it would drown the answer.
        break;
      case "tool_start":
        appendToolCall(event.name, event.arguments);
        break;
      case "tool_end":
        appendToolResult(event.ok, event.result);
        break;
      case "turn_end":
        endAssistantTurn();
        setBusy(false);
        document.getElementById("timing").textContent =
          event.steps + " steps \u00b7 " + event.tool_calls + " tools \u00b7 " +
          event.usage.input + "/" + event.usage.output + " tok (" +
          event.usage.cached + " cached) \u00b7 model " + event.timing.model_ms +
          " ms, tools " + event.timing.tools_ms + " ms";
        toShell({ cmd: "status" });
        break;
      case "error":
        endAssistantTurn();
        setBusy(false);
        // Kept in the transcript by the shell, so it survives a session switch.
        stream.append(errorBlock(event.message));
        scrollToEnd();
        break;
      case "step":
        // Steps surface through tool cards and the closing summary.
        break;
    }
  },
};

// ---------------------------------------------------------------- composer

function submit() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  autoGrow();
  toShell({ cmd: "prompt", text });
}

function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}

send.addEventListener("click", submit);
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    submit();
  }
});
document.getElementById("new-session").addEventListener("click", () => {
  toShell({ cmd: "new_session" });
});

// ---------------------------------------------------------------- settings

for (const field of [setBaseUrl, setApiKey, setModel]) {
  field.addEventListener("input", () => { settingsDirty = true; });
}

function saveSettings() {
  // A blank key box means "keep the stored key": the shell never sends the key
  // back, so an empty field must not be read as "erase it".
  const payload = {
    cmd: "save_settings",
    base_url: setBaseUrl.value.trim(),
    model: setModel.value.trim(),
  };
  if (setApiKey.value.trim() !== "") {
    payload.api_key = setApiKey.value.trim();
  } else {
    payload.keep_api_key = true;
  }
  toShell(payload);
}

document.getElementById("save-settings").addEventListener("click", saveSettings);
setApiKey.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    event.preventDefault();
    saveSettings();
  }
});

// The page is loaded and listening; ask the shell for initial state.
toShell({ cmd: "ready" });
</script>
</body>
</html>
