[package]
name = "ngu-desktop"
version = "0.1.0"
edition = "2021"
description = "Nguruvilu desktop shell: a native window over the kernel, shipped as one exe."

[[bin]]
name = "ngu-desktop"
path = "src/main.rs"

[dependencies]
nguruvilu = { path = ".." }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
serde_json = "1"
anyhow = "1"
# Fresh bearer token per `--serve` run.
uuid = { version = "1", features = ["v4"] }

# The window is a Windows concern (tao + wry + WebView2 + native dialogs); the
# shell underneath it - dispatch, state, headless, serve - must build without
# any GUI stack, which is what lets --serve run on a headless server.
[target.'cfg(target_os = "windows")'.dependencies]
tao = "0.30"
wry = "0.47"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Standalone: the desktop shell builds on its own, so the kernel and CLI keep
# zero GUI dependencies.
[workspace]
