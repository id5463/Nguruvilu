[package]
name = "ngu-desktop"
version = "0.1.0"
edition = "2021"
description = "Nguruvilu desktop shell: a native window over the kernel, shipped as one exe."

[[bin]]
name = "ngu-desktop"
path = "src/main.rs"

[dependencies]
nguruvilu = { path = ".." }
tao = "0.30"
wry = "0.47"
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Standalone: the desktop shell builds on its own, so the kernel and CLI keep
# zero GUI dependencies.
[workspace]
