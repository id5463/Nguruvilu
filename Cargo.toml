[package]
name = "nguruvilu"
version = "0.1.0"
edition = "2021"
description = "Nguruvilu — an independent agent kernel: four tools, a loop, and everything else as plugins."
license = "MIT"
repository = "https://github.com/id5463/Nguruvilu"

[[bin]]
name = "ngu"
path = "src/main.rs"

[lib]
name = "nguruvilu"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
zip = "2"
libloading = "0.8"
sha1 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
