<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaScribe</title> <!-- Title can also be localized if needed, but JS runs after this -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      overscroll-behavior-y: contain; /* Prevents pull-to-refresh on mobile */
    }
    /* Custom scrollbar for webkit browsers */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1f2937; /* gray-800 */
    }
    ::-webkit-scrollbar-thumb {
      background: #4b5563; /* gray-600 */
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6b7280; /* gray-500 */
    }
    /* For Firefox */
    .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #4b5563 #1f2937;
    }

    /* Basic focus visibility improvement */
    *:focus-visible {
        outline: 2px solid #a855f7; /* purple-500 */
        outline-offset: 2px;
        box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.2); /* Softer outer glow */
    }
    /* Remove default outline for elements that have custom focus-visible */
    *:focus:not(:focus-visible) {
        outline: none;
    }

  </style>
